<!DOCTYPE html> <!--Tipo de documento HTML5-->
<html lang="pt-br"> <!--Idioma do documento-->
<head> <!--Cabeçalho do documento-->
    <meta charset="UTF-8"> <!--Codificação de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Configuração de visualização para dispositivos móveis-->
    <title>Div e Span</title> <!--Título da página-->
    <style> /* Estilos CSS para os elementos div e span */
        div { /* Estilo para o elemento div */
            background-color: lightgray;/* Cor de fundo cinza claro */
            padding: 10px;/* Espaçamento interno de 10 pixels */
            margin: 10px 0;/* Espaçamento externo de 10 pixels em cima e embaixo */
        }
        span {/* Estilo para o elemento span */
            background-color: lightblue;/* Cor de fundo azul claro */
            padding: 5px;/* Espaçamento interno de 5 pixels */
        }
    </style>
</head> <!--Fim do cabeçalho do documento-->
<body> <!--Corpo do documento-->
    <p><div>Trabalhando com </div>DIV</p> <!--Parágrafo com elemento div dentro. DIV é um elemento de bloco: ocupa toda a largura disponível, por isso empurra "DIV" para a linha de baixo-->
    <p><span>Trabalhando com </span>SPAN</p> <!--Parágrafo com elemento span dentro. SPAN é um elemento inline: ocupa só a largura do próprio conteúdo, por isso "SPAN" continua na mesma linha-->
</body> <!--Fim do corpo do documento-->
</html> <!--Fim do documento HTML-->
