<!DOCTYPE html> <!--Tipo de documento HTML5-->
<html lang="pt-br"> <!--Idioma do documento-->
<head> <!--Cabeçalho do documento-->
    <meta charset="UTF-8"> <!--Codificação de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Configuração de visualização para dispositivos móveis-->
    <title>Estrututando seu HTML + Formatações</title> <!--Título da página-->
</head> <!--Fim do cabeçalho do documento-->
<body> <!--Corpo do documento-->
    <!-- Formatação de texto - part 1-->
    <p><i>Texto em itálico</i></p> <!--Parágrafo com texto em itálico-->
    <p><b>Texto em negrito</b></p> <!--Parágrafo com texto em negrito-->
    <p><strong>Texto em negrito (strong)</strong></p> <!--Parágrafo com texto em negrito (strong), da mais ênfase a aquele trecho do texto-->
    <p><u>Texto sublinhado</u></p> <!--Parágrafo com texto sublinhado-->
    <p><mark>Texto marcado</mark></p> <!--Parágrafo com texto marcado-->
    <p><small>Texto pequeno</small></p> <!--Parágrafo com texto pequeno-->
    <p><del>Texto riscado</del></p> <!--Parágrafo com texto riscado-->
    <p>H<sup>2</sup>O</p> <!--Parágrafo com texto em sobrescrito-->
    <p>CO<sub>2</sub></p> <!--Parágrafo com texto em subscrito-->
    <p><blockquote>lorem ipsum dolor sit amet</blockquote></p> <!--Parágrafo com texto em citação, espaço do lado esquerdo-->

    <!-- Formatação de texto - part 2-->
    <font color="blue" size="4" face="'Trebuchet MS', Arial, Tahoma, Verdana">Texto com cor azul e tamanho 4</font> <!--Tag <font>: definia cor, tamanho e fonte do texto. OBS: obsoleta no HTML5, hoje isso deve ser feito via CSS (color, font-size, font-family)-->
</body> <!--Fim do corpo do documento-->
</html> <!--Fim do documento HTML-->
