<!DOCTYPE html> <!--Tipo de documento HTML5-->
<html lang="pt-br"> <!--Idioma do documento-->
<head> <!--Cabeçalho do documento-->
    <meta charset="UTF-8"> <!--Codificação de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Configuração de visualização para dispositivos móveis-->
    <title>Textarea</title> <!--Título da página-->
</head> <!--Fim do cabeçalho do documento-->
<body> <!--Corpo do documento-->
    <label for="mensagem">Mensagem:</label> <!--Label associado ao textarea, com o atributo "for" apontando para o ID do textarea-->
    <textarea id="mensagem" name="mensagem" rows="10" cols="50" placeholder="Digite sua mensagem aqui..."></textarea> <!--Textarea com ID, nome, número de linhas e colunas, e placeholder-->
    <button type="submit">Enviar</button> <!--Botão de envio. Sem um <form> envolvendo os campos, o clique não envia nada; o label envolvendo o button foi removido pois <label> serve para associar texto a campos como input/textarea/select, não a botões-->
</body> <!--Fim do corpo do documento-->
</html> <!--Fim do documento HTML-->
