<!DOCTYPE html> <!--Tipo de documento HTML5-->
<html lang="pt-br"> <!--Idioma do documento-->
<head> <!--Cabeçalho do documento-->
    <meta charset="UTF-8"> <!--Codificação de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Configuração de visualização para dispositivos móveis-->
    <title>Botões e seus tipos</title> <!--Título da página-->
</head> <!--Fim do cabeçalho do documento-->
<body> <!--Corpo do documento-->
    <form method="get"> <!--Início do formulário com método GET-->
        <label for="nome">Nome:*</label> <!--Rótulo para o campo de entrada de nome-->
        <input type="text" id="nome" name="nome" required> <!--Campo de entrada de texto para o nome, obrigatório (required)-->
        <br><br> <!--Quebra de linha dupla para espaçamento-->
        <button type="button">Botão de Ação</button> <!--Botão de ação que não envia o formulário. Pode ser usado para ações JavaScript, por exemplo-->
        <button type="submit">Botão de Envio</button> <!--Botão de envio do formulário. Ao ser clicado, envia os dados do formulário para o servidor-->
        <button type="reset">Botão de Limpeza</button> <!--Botão de limpeza do formulário. Ao ser clicado, limpa todos os campos do formulário, retornando-os ao estado inicial-->
    </form> <!--Fim do formulário-->
</body> <!--Fim do corpo do documento-->
</html> <!--Fim do documento HTML-->
